<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>StormPT chat QA</title>
<body style="background:#131b27;color:#fff">
<main id="world" style="position:relative;width:800px;height:600px"></main>
<script type="module">
import {NativeChatPanel} from '../src/native-chat.mjs';
window.sent=[];
const panel=new NativeChatPanel(document.getElementById('world'),{onSend:value=>{
 if(value.startsWith('/'))throw Error('Comandos bloqueados');
 window.sent.push(value);
}});
window.chatPanel=panel;window.qaReady=true;
</script></body></html>
