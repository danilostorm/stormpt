<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>StormPT Web | Pillai 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#eedcc3;font:14px system-ui,Arial}
canvas{width:100vw;height:100vh;display:block;touch-action:none}
section{position:fixed;top:14px;left:14px;background:#101623e8;border:1px solid #b39869;
padding:17px;border-radius:10px;max-width:350px;box-shadow:0 12px 40px #0007}
h1{font:24px Georgia,serif;letter-spacing:3px;color:#f0c885;margin:0 0 5px}
small{color:#acb6c5}#info{line-height:1.6;margin-top:10px}
footer{position:fixed;left:14px;right:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
footer span{background:#101623d9;border:1px solid #a28a62;border-radius:6px;padding:10px}
button{background:#172438;color:#f0c885;border:1px solid #a28a62;border-radius:5px;padding:9px;cursor:pointer}
#btn{position:fixed;right:14px;top:14px}
@media(max-width:700px){section{max-width:80vw;padding:10px}h1{font-size:17px}footer{font-size:11px}}
</style></head><body>
<canvas id="game"></canvas>
<section><h1>STORMPT WEB</h1><small>LABORATÓRIO GRÁFICO • PILLAI</small>
<div id="info">Carregando mapa original...</div></section>
<button id="btn">Reiniciar câmera</button>
<footer><span id="state">Protótipo gráfico: sem personagem, texturas ou multiplayer.</span>
<span>Arrastar: girar | Roda: zoom | WASD: explorar | Q/E: altura | Shift: acelerar</span></footer>
<script type="module">
const canvas=document.getElementById('game'),label=document.getElementById('info');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:true});
let az=2.1,el=.74,dist=10000,target=[0,0,0],keys={},last=0,count=0,program,vao,mvpLoc,eyeLoc;
function norm(v){const d=Math.hypot(...v)||1;return v.map(x=>x/d)}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function dot(a,b){return a.reduce((s,x,i)=>s+x*b[i],0)}
function view(e,t){const z=norm(e.map((v,i)=>v-t[i])),x=norm(cross([0,1,0],z)),y=cross(z,x);
return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]}
function proj(w,h){let f=1/Math.tan(Math.PI/6),n=1,far=100000;
return[f*h/w,0,0,0,0,f,0,0,0,0,(n+far)/(n-far),-1,0,0,2*n*far/(n-far),0]}
function mul(a,b){let o=[];for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[r+4]*b[c*4+1]+a[r+8]*b[c*4+2]+a[r+12]*b[c*4+3];return new Float32Array(o)}
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function setup(){
if(!gl)throw Error('WebGL 2 indisponível na GPU ou no navegador.');
program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,`#version 300 es
layout(location=0)in vec3 p;layout(location=1)in vec4 c;
uniform mat4 mvp;out vec3 vPos,vColor;
void main(){vPos=p;vColor=c.rgb;gl_Position=mvp*vec4(p,1.);}`));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec3 vPos,vColor;uniform vec3 eye;out vec4 color;
void main(){
vec3 n=normalize(cross(dFdx(vPos),dFdy(vPos)));
float light=.55+.45*abs(dot(n,normalize(vec3(.6,1.,.45))));
float fog=smoothstep(6500.,17000.,length(eye-vPos));
vec3 rgb=mix(clamp(vColor*1.40,0.,1.)*light,vec3(.12,.18,.25),fog*.74);
color=vec4(rgb,1.);
}`));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
mvpLoc=gl.getUniformLocation(program,'mvp');eyeLoc=gl.getUniformLocation(program,'eye');
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(.085,.14,.22,1);
}
function render(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;
let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
let r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
let s=dist*.33*dt*(keys.shift?3:1);target[0]+=(-Math.sin(az)*f+Math.cos(az)*r)*s;
target[2]+=(-Math.cos(az)*f-Math.sin(az)*r)*s;
target[1]+=(keys.e?1:0)*s-(keys.q?1:0)*s;
let ratio=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);
if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}
const eye=[target[0]+dist*Math.cos(el)*Math.sin(az),target[1]+dist*Math.sin(el),target[2]+dist*Math.cos(el)*Math.cos(az)];
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);
gl.uniformMatrix4fv(mvpLoc,false,mul(proj(w,h),view(eye,target)));
gl.uniform3fv(eyeLoc,new Float32Array(eye));gl.bindVertexArray(vao);
gl.drawArrays(gl.TRIANGLES,0,count);requestAnimationFrame(render)}
let drag;
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;az+=(e.clientX-drag[0])*.005;el=Math.max(.08,Math.min(1.5,el+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(20,Math.min(30000,dist*Math.exp(e.deltaY*.001)))},{passive:false});
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',()=>keys={});
document.getElementById('btn').onclick=()=>{target=[0,0,0];dist=10000;az=2.1;el=.74};
try{
setup();
const info=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json());
const res=await fetch('pillai.bin');
if(!res.ok)throw Error('Mapa não encontrado');
const raw=await res.arrayBuffer();
if(raw.byteLength%16)throw Error('Arquivo de malha inválido');
count=raw.byteLength/16;
if(count!==info.triangle_vertices)throw Error('Malha incompleta');
vao=gl.createVertexArray();gl.bindVertexArray(vao);
const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,raw,gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,16,0);
gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.UNSIGNED_BYTE,true,16,12);
label.innerHTML=`${info.stage_vertices.toLocaleString('pt-BR')} vértices • ${info.stage_faces.toLocaleString('pt-BR')} faces<br>Geometria original convertida com sucesso.`;
requestAnimationFrame(render);
}catch(e){label.textContent='Falha: '+e.message;console.error(e)}
</script></body></html>
